<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascota de CRISS’ STORE · Demostración</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f9;color:#12263a;font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{text-align:center;padding:24px;max-width:420px}
h1{margin:0 0 4px;font-size:24px}
#m{width:min(300px,80vw);height:min(300px,80vw);margin:18px auto}
.bt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
button{padding:12px;border:2px solid #12263a;background:#fff;color:#12263a;border-radius:10px;font:700 15px inherit;cursor:pointer}
button.on{background:#12263a;color:#ffd23f}
.mu{color:#5d6b7a;font-size:14px;margin-top:12px}
</style>
</head>
<body>
<main>
  <h1>Mascota de CRISS’ STORE</h1>
  <div class="mu" id="et">Estado: alegre y pícara</div>
  <div id="m"></div>
  <div class="bt">
    <button data-e="alegre" class="on">😏 Alegre y pícara</button>
    <button data-e="canta">🎤 Cantando</button>
    <button data-e="asoma">🔍 Asomándose al vidrio</button>
    <button data-e="reposo">😴 Descansando</button>
  </div>
  <div class="mu">Mantén el mouse sobre los botones o tócalos para ver cada movimiento.</div>
</main>
<script src="mascota.js"></script>
<script>
const NOM = { alegre: 'alegre y pícara', canta: 'cantando', asoma: 'asomándose al vidrio', reposo: 'descansando' };
const m = document.getElementById('m');
Mascota.montar(m, new URLSearchParams(location.search).get('e') || 'alegre');
document.querySelectorAll('button').forEach(b => b.onclick = () => {
  Mascota.estado(m, b.dataset.e);
  document.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('et').textContent = 'Estado: ' + NOM[b.dataset.e];
});
</script>
</body>
</html>
