<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRISS’ STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12263a;--ban:#ffd23f;--bg:#f4f6f9;--card:#fff;--ln:#dde3ea;--mu:#5d6b7a;--ok:#0b7a75;--bad:#d64045;
--hd:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--tx:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--tx)}
header{background:var(--ban);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px}
.bar{max-width:900px;margin:0 auto}
h1{margin:0;font:800 clamp(30px,8vw,46px)/1 var(--hd);letter-spacing:-.5px}
nav{display:flex;gap:8px;margin-top:12px}
nav button{flex:1;padding:10px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:10px;font:700 15px var(--tx);cursor:pointer}
nav button.on{background:var(--ink);color:var(--ban)}
main{max-width:900px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
h2{font:700 19px var(--hd);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select{width:100%;padding:11px;border:1px solid var(--ln);border-radius:9px;background:#fff;color:var(--ink);font:16px var(--tx)}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{margin-top:12px;padding:12px 16px;border:0;border-radius:10px;background:var(--ink);color:#fff;font:700 16px var(--tx);cursor:pointer}
.btn.go{background:var(--ok)}
.btn.sm{margin:0;padding:6px 10px;font-size:14px;background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.sm.red{color:var(--bad);border-color:var(--bad)}
.mu{color:var(--mu);font-size:14px}
.msg{min-height:22px;margin-top:8px;color:var(--ok);font-weight:500}
.msg.err{color:var(--bad)}
.hide{display:none!important}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;background:var(--card);border:1px solid var(--ln);border-radius:12px;cursor:pointer;font:inherit;color:inherit}
.tile:active{transform:scale(.98)}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:#e9edf2;display:grid;place-items:center;font-size:40px}
.tile .nm{padding:8px 10px 0;font-weight:700}
.tile .sub{padding:0 10px 10px;font-size:13px;color:var(--mu)}
.tag{position:absolute;top:8px;left:8px;background:var(--bad);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}
.line:last-child{border:0}
.sheet{position:fixed;inset:0;background:rgba(18,38,58,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet>div{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet img{width:100%;max-height:220px;object-fit:cover;border-radius:10px}
.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}
.qty button{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:24px;cursor:pointer}
.qty b{font-size:28px;min-width:40px;text-align:center}
.alert{background:#fff4f4;border:1px solid var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.alert strong{color:var(--bad)}
.pcard{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start}
.pcard img,.pcard .ph{width:90px;height:90px;border-radius:10px;font-size:30px}
.qr{background:#fff;padding:6px;display:inline-block;border-radius:8px;margin-top:8px;border:1px solid var(--ln)}
.low{color:var(--bad);font-weight:700}
.total{font:800 22px var(--hd)}
video{width:100%;border-radius:10px;margin-top:10px;background:#000}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
  <h1>CRISS’ STORE</h1>
  <nav>
    <button data-t="buy" class="on">Comprar</button>
    <button data-t="adm">Administrador</button>
  </nav>
</div></header>

<main>
<!-- ================= CLIENTES ================= -->
<section id="buy">
  <div class="card">
    <h2>¿Quién eres?</h2>
    <select id="cl"></select>
    <button class="btn" id="scan">Escanear QR del producto</button>
    <video id="vid" class="hide" playsinline muted></video>
    <div class="msg" id="bm"></div>
  </div>

  <h2>Elige tu producto</h2>
  <div class="tiles" id="cat"></div>

  <div class="card" style="margin-top:14px">
    <h2>Mi cuenta pendiente</h2>
    <div id="acc" class="mu">Elige tu nombre para ver tu cuenta.</div>
  </div>
</section>

<!-- ================= ADMINISTRADOR ================= -->
<section id="adm" class="hide">
  <div id="login" class="card">
    <h2>Entrar como administrador</h2>
    <label>Correo</label><input id="em" type="email" autocomplete="username">
    <label>Contraseña</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn" id="lg">Entrar</button>
    <div class="msg err" id="lm"></div>
  </div>

  <div id="panel" class="hide">
    <div class="card">
      <div class="line" style="border:0;padding:0"><h2 style="margin:0">Por agotarse</h2><button class="btn sm" id="out">Salir</button></div>
      <div id="alerts" style="margin-top:8px"></div>
    </div>

    <div class="card">
      <h2>Cargar producto</h2>
      <label>Nombre</label><input id="pn" placeholder="Ej: Soda de naranja">
      <div class="row">
        <div><label>Marca</label><input id="pm" placeholder="Ej: Country Club"></div>
        <div><label>Especificación</label><input id="pe" placeholder="Ej: 355 ml"></div>
      </div>
      <div class="row">
        <div><label>Precio ($)</label><input id="pp" type="number" min="0" step="0.01"></div>
        <div><label>Existencia inicial</label><input id="ps" type="number" min="0" step="1"></div>
      </div>
      <label>Avisar cuando queden (o menos)</label><input id="pu" type="number" min="0" value="2">
      <label>Foto del producto</label><input id="pf" type="file" accept="image/*">
      <button class="btn go" id="addp">Guardar producto</button>
      <div class="msg" id="pmsg"></div>
    </div>

    <div class="card">
      <h2>Cuentas por cobrar</h2>
      <label>Cliente</label><select id="cs"></select>
      <div id="cd"></div>
    </div>

    <h2>Inventario</h2>
    <div id="plist"></div>
  </div>
</section>
</main>

<div id="sheet" class="sheet hide"><div>
  <img id="si" alt="" class="hide">
  <h2 id="sn" style="margin-top:10px"></h2>
  <div class="mu" id="ss"></div>
  <div class="qty"><button id="mn" aria-label="Menos">−</button><b id="sq">1</b><button id="pl" aria-label="Más">+</button></div>
  <button class="btn go" id="sok" style="width:100%">Confirmar retiro</button>
  <button class="btn sm" id="scx" style="width:100%;margin-top:8px;padding:11px">Cancelar</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n).toFixed(2);
const say = (id, t, err) => { const e = $(id); e.textContent = t; e.classList.toggle('err', !!err); };
const codeOf = t => { const r = /P-\d+/i.exec(String(t)); return r ? r[0].toUpperCase() : null; };
const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

let clientes = [], cat = [], cur = null, qty = 1;
let prods = [], pend = [], isAdmin = false, stream = null, timer = null;

/* ---------- Navegación ---------- */
function tab(t) {
  $('buy').classList.toggle('hide', t !== 'buy');
  $('adm').classList.toggle('hide', t !== 'adm');
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if (t !== 'buy') stopScan();
  if (t === 'adm' && isAdmin) loadAdmin();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => tab(b.dataset.t));

/* ================= CLIENTES ================= */
async function loadClients() {
  const { data } = await sb.from('clientes').select('*').order('id');
  clientes = data || [];
  const opts = clientes.map(c => `<option value="${c.id}">${c.id} · ${esc(c.nombre)}</option>`).join('');
  $('cl').innerHTML = '<option value="">Elige tu nombre</option>' + opts;
  $('cs').innerHTML = '<option value="">Resumen de todos</option>' + opts;
  try { const s = localStorage.getItem('cliente'); if (s && clientes.some(c => c.id === s)) $('cl').value = s; } catch (e) {}
  loadAccount();
}
const nombreDe = id => (clientes.find(c => c.id === id) || {}).nombre || id;

async function loadCatalog() {
  const { data, error } = await sb.rpc('catalogo');
  if (error) { say('bm', 'No se pudo cargar el catálogo. Revisa config.js.', true); return; }
  cat = data || [];
  $('cat').innerHTML = cat.length ? cat.map(p => `
    <button class="tile" data-c="${esc(p.codigo)}" ${p.disponible ? '' : 'disabled'}>
      ${p.disponible ? '' : '<span class="tag">Agotado</span>'}
      ${p.imagen_url ? `<img src="${esc(p.imagen_url)}" alt="" loading="lazy">` : '<div class="ph">🛍️</div>'}
      <span class="nm">${esc(p.nombre)}</span>
      <span class="sub">${esc([p.marca, p.especificacion].filter(Boolean).join(' · '))}</span>
    </button>`).join('') : '<div class="mu">Todavía no hay productos.</div>';
}
$('cat').onclick = e => { const b = e.target.closest('.tile'); if (b && !b.disabled) openSheet(b.dataset.c); };

async function loadAccount() {
  const c = $('cl').value, box = $('acc');
  if (!c) { box.className = 'mu'; box.textContent = 'Elige tu nombre para ver tu cuenta.'; return; }
  const { data } = await sb.rpc('mi_cuenta', { p_cliente: c });
  box.className = '';
  box.innerHTML = (data && data.length)
    ? data.map(r => `<div class="line"><span>${esc(r.producto)}</span><strong>× ${r.cantidad}</strong></div>`).join('')
    : '<span class="mu">No tienes productos pendientes.</span>';
}
$('cl').onchange = () => { try { localStorage.setItem('cliente', $('cl').value); } catch (e) {} say('bm', ''); loadAccount(); };

function openSheet(codigo) {
  if (!$('cl').value) { say('bm', 'Primero elige tu nombre.', true); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  cur = cat.find(p => p.codigo === codigo);
  if (!cur) { say('bm', 'Producto no encontrado: ' + codigo, true); return; }
  if (!cur.disponible) { say('bm', cur.nombre + ' está agotado.', true); return; }
  qty = 1; $('sq').textContent = 1;
  $('sn').textContent = cur.nombre;
  $('ss').textContent = [cur.marca, cur.especificacion].filter(Boolean).join(' · ');
  $('si').classList.toggle('hide', !cur.imagen_url);
  if (cur.imagen_url) $('si').src = cur.imagen_url;
  $('sheet').classList.remove('hide');
}
const closeSheet = () => { $('sheet').classList.add('hide'); cur = null; };
$('scx').onclick = closeSheet;
$('mn').onclick = () => { qty = Math.max(1, qty - 1); $('sq').textContent = qty; };
$('pl').onclick = () => { qty = Math.min(50, qty + 1); $('sq').textContent = qty; };
$('sok').onclick = async () => {
  if (!cur) return;
  $('sok').disabled = true;
  const { error } = await sb.rpc('registrar_compra', { p_cliente: $('cl').value, p_codigo: cur.codigo, p_cantidad: qty });
  $('sok').disabled = false;
  const nombre = cur.nombre;
  closeSheet();
  if (error) say('bm', error.message, true);
  else say('bm', `Listo ${nombreDe($('cl').value)}: ${qty} × ${nombre} quedó en tu cuenta.`);
  loadAccount(); loadCatalog();
};

/* ---------- Escáner QR ---------- */
function stopScan() {
  if (timer) { clearInterval(timer); timer = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('vid').classList.add('hide');
}
$('scan').onclick = async () => {
  if (!$('cl').value) { say('bm', 'Primero elige tu nombre.', true); return; }
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices) {
    say('bm', 'Este navegador no lee QR aquí. Usa la cámara del teléfono o toca el producto.', true); return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = $('vid'); v.srcObject = stream; v.classList.remove('hide'); await v.play();
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    timer = setInterval(async () => {
      try {
        const r = await det.detect(v);
        if (r.length) { const c = codeOf(r[0].rawValue); if (c) { stopScan(); openSheet(c); } }
      } catch (e) {}
    }, 300);
  } catch (e) { stopScan(); say('bm', 'No se pudo abrir la cámara. Toca el producto en la lista.', true); }
};

/* ================= ADMINISTRADOR ================= */
$('lg').onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  say('lm', error ? 'Correo o contraseña incorrectos.' : '', true);
};
$('out').onclick = () => sb.auth.signOut();
sb.auth.onAuthStateChange((_ev, session) => {
  isAdmin = !!session;
  $('login').classList.toggle('hide', isAdmin);
  $('panel').classList.toggle('hide', !isAdmin);
  if (isAdmin && !$('adm').classList.contains('hide')) loadAdmin();
});

async function loadAdmin() {
  const [p, c] = await Promise.all([
    sb.from('productos').select('*').eq('activo', true).order('id'),
    sb.from('compras').select('*').eq('pagada', false).order('id')
  ]);
  prods = p.data || []; pend = c.data || [];
  renderAlerts(); renderProds(); renderCob();
}

function renderAlerts() {
  const low = prods.filter(p => p.stock <= p.umbral).sort((a, b) => a.stock - b.stock);
  $('alerts').innerHTML = low.length ? low.map(p => `
    <div class="alert"><strong>${p.stock === 0 ? 'Agotado' : 'Quedan ' + p.stock}</strong> · ${esc(p.nombre)}
      <div class="mu">Repón de la misma marca y especificación: ${esc([p.marca, p.especificacion].filter(Boolean).join(' · ') || 'sin datos')}</div>
      <button class="btn sm" data-rep="${p.id}" style="margin-top:6px">Ingresar unidades</button>
    </div>`).join('') : '<span class="mu">Todo el inventario está al día.</span>';
}

function renderProds() {
  const L = $('plist');
  if (!prods.length) { L.innerHTML = '<div class="mu">Aún no hay productos. Carga el primero arriba.</div>'; return; }
  L.innerHTML = prods.map(p => `
    <div class="card pcard">
      ${p.imagen_url ? `<img src="${esc(p.imagen_url)}" alt="">` : '<div class="ph">🛍️</div>'}
      <div>
        <strong>${esc(p.nombre)}</strong>
        <div class="mu">${esc(p.codigo)} · ${esc([p.marca, p.especificacion].filter(Boolean).join(' · '))}</div>
        <div>${money(p.precio)} · Existencia: <span class="${p.stock <= p.umbral ? 'low' : ''}">${p.stock}</span></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn sm" data-rep="${p.id}">Ingresar unidades</button>
          <button class="btn sm red" data-del="${p.id}">Quitar</button>
        </div>
        <div class="qr" id="qr-${p.id}"></div>
      </div>
    </div>`).join('');
  prods.forEach(p => {
    try { new QRCode($('qr-' + p.id), { text: location.origin + location.pathname + '?p=' + p.codigo, width: 110, height: 110 }); } catch (e) {}
  });
}

document.addEventListener('click', async e => {
  const r = e.target.closest('[data-rep]'), d = e.target.closest('[data-del]');
  if (r) {
    const p = prods.find(x => x.id == r.dataset.rep);
    const n = parseInt(prompt(`¿Cuántas unidades ingresan de ${p.nombre}?`), 10);
    if (!(n > 0)) return;
    await sb.from('productos').update({ stock: p.stock + n }).eq('id', p.id);
    loadAdmin();
  }
  if (d) {
    const p = prods.find(x => x.id == d.dataset.del);
    if (!confirm(`¿Quitar ${p.nombre} del catálogo? Las compras anteriores se conservan.`)) return;
    await sb.from('productos').update({ activo: false }).eq('id', p.id);
    loadAdmin(); loadCatalog();
  }
});

async function reducir(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 800 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  return new Promise(res => cv.toBlob(res, 'image/jpeg', 0.82));
}
$('addp').onclick = async () => {
  const nombre = $('pn').value.trim(), precio = parseFloat($('pp').value), stock = parseInt($('ps').value, 10);
  if (!nombre || isNaN(precio) || isNaN(stock)) { say('pmsg', 'Completa nombre, precio y existencia.', true); return; }
  $('addp').disabled = true; say('pmsg', 'Guardando…');
  try {
    let imagen_url = null;
    const f = $('pf').files[0];
    if (f) {
      const blob = await reducir(f);
      const path = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
      const up = await sb.storage.from('productos').upload(path, blob, { contentType: 'image/jpeg' });
      if (up.error) throw up.error;
      imagen_url = sb.storage.from('productos').getPublicUrl(path).data.publicUrl;
    }
    const { data, error } = await sb.from('productos').insert({
      nombre, marca: $('pm').value.trim() || null, especificacion: $('pe').value.trim() || null,
      precio, stock, umbral: parseInt($('pu').value, 10) || 2, imagen_url
    }).select().single();
    if (error) throw error;
    ['pn', 'pm', 'pe', 'pp', 'ps', 'pf'].forEach(i => $(i).value = '');
    say('pmsg', `Producto ${data.codigo} guardado.`);
    loadAdmin(); loadCatalog();
  } catch (e) { say('pmsg', 'No se pudo guardar: ' + (e.message || e), true); }
  $('addp').disabled = false;
};

function renderCob() {
  const c = $('cs').value, box = $('cd');
  if (!c) {
    const tot = {};
    pend.forEach(f => tot[f.cliente_id] = (tot[f.cliente_id] || 0) + Number(f.monto));
    const ks = Object.keys(tot);
    box.innerHTML = ks.length ? ks.map(k => `<div class="line"><span>${k} · ${esc(nombreDe(k))}</span><strong>${money(tot[k])}</strong></div>`).join('')
      : '<div class="mu" style="margin-top:8px">No hay facturas pendientes.</div>';
    return;
  }
  const fs = pend.filter(f => f.cliente_id === c);
  const total = fs.reduce((s, f) => s + Number(f.monto), 0);
  box.innerHTML = fs.length ? fs.map(f => `
    <div class="line"><div><strong>${esc(f.factura)}</strong> · ${f.cantidad} × ${esc(f.producto_nombre)}
      <div class="mu">${new Date(f.fecha).toLocaleDateString('es')}</div></div>
      <div><strong>${money(f.monto)}</strong> <button class="btn sm" data-pay="${f.id}">Cobrada</button></div></div>`).join('')
    + `<div style="margin-top:10px">Total por cobrar: <span class="total">${money(total)}</span></div>
       <button class="btn sm" data-payall="${c}" style="margin-top:8px">Marcar todas como cobradas</button>`
    : '<div class="mu" style="margin-top:8px">Sin facturas pendientes para este cliente.</div>';
}
$('cs').onchange = renderCob;
$('cd').onclick = async e => {
  const p = e.target.closest('[data-pay]'), a = e.target.closest('[data-payall]');
  if (p) await sb.from('compras').update({ pagada: true }).eq('id', p.dataset.pay);
  else if (a) await sb.from('compras').update({ pagada: true }).eq('cliente_id', a.dataset.payall).eq('pagada', false);
  else return;
  await loadAdmin(); loadAccount();
};

/* ---------- Inicio ---------- */
(async () => {
  await Promise.all([loadClients(), loadCatalog()]);
  const c = codeOf(new URLSearchParams(location.search).get('p') || '');
  if (c) openSheet(c);
})();
</script>
</body>
</html>
